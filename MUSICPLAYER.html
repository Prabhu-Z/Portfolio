<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Music Player UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  font-family:'Segoe UI',sans-serif;
}

.player{
  width:330px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
  border-radius:25px;
  padding:20px;
  color:#fff;
  box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.cover{
  width:100%;
  height:220px;
  border-radius:20px;
  background:url("https://images.unsplash.com/photo-1511379938547-c1f69419868d") center/cover no-repeat;
}

.info{
  text-align:center;
  margin:15px 0;
}

.info h3{
  margin:5px 0;
  font-size:18px;
}

.info p{
  margin:0;
  font-size:14px;
  opacity:0.8;
}

.progress{
  margin:15px 0;
}

.time{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  opacity:0.7;
}

.bar{
  height:6px;
  background:rgba(255,255,255,0.2);
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.fill{
  width:40%;
  height:100%;
  background:linear-gradient(90deg,#1db954,#1ed760);
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin:20px 0;
}

.btn{
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  cursor:pointer;
}

.play{
  width:60px;
  height:60px;
  background:#1db954;
  color:#000;
  font-size:22px;
}

.playlist{
  margin-top:15px;
}

.song{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:12px;
  margin-bottom:8px;
  background:rgba(255,255,255,0.1);
}

.song img{
  width:40px;
  height:40px;
  border-radius:8px;
  object-fit:cover;
}

.song div{
  font-size:14px;
}
</style>
</head>

<body>

<div class="player">
  <div class="cover"></div>

  <div class="info">
    <h3>Midnight Vibes</h3>
    <p>Lo-Fi Beats</p>
  </div>

  <div class="progress">
    <div class="time">
      <span>1:15</span>
      <span>3:45</span>
    </div>
    <div class="bar">
      <div class="fill"></div>
    </div>
  </div>

  <div class="controls">
    <div class="btn">⏮</div>
    <div class="btn play">▶</div>
    <div class="btn">⏭</div>
  </div>

  <div class="playlist">
    <div class="song">
      <img src="https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2">
      <div>
        <strong>Night Drive</strong><br>
        <small>Chillhop</small>
      </div>
    </div>

    <div class="song">
      <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f">
      <div>
        <strong>City Lights</strong><br>
        <small>Ambient</small>
      </div>
    </div>
  </div>
</div>

</body>
</html>
